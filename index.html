<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add custom markers in Mapbox GL JS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans"
      rel="stylesheet"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
        .marker {
      background-image: url('https://docs.mapbox.com/help/demos/custom-markers-gl-js/mapbox-icon.png');
      background-size: cover;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
    }
        .mapboxgl-popup {
      max-width: 200px;
    }

    .mapboxgl-popup-content {
      text-align: center;
      font-family: 'Open Sans', sans-serif;
    }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
    const map = new mapboxgl.Map({
        accessToken: 'pk.eyJ1Ijoid29tYmF0LW1hcHMiLCJhIjoiY212bHpnYng4MDFuOTMwb2Y1MW12b200dyJ9.TMR7I4sA-miKE9dGtGPgEw',
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        center: [-96, 37.8],
        zoom: 3
      });
    const geojson = {
       type: 'FeatureCollection',
       features: [
         {
           type: 'Feature',
           geometry: {
             type: 'Point',
             coordinates: [-77.032, 38.913]
           },
           properties: {
             title: 'Mapbox',
             description: 'Washington, D.C.'
           }
         },
         {
           type: 'Feature',
           geometry: {
             type: 'Point',
             coordinates: [-122.414, 37.776]
           },
           properties: {
             title: 'Mapbox',
             description: 'San Francisco, California'
           }
         }
       ]
     };
      // add markers to map
    for (const feature of geojson.features) {
     // create an HTML element for each feature
       const el = document.createElement('div');
       el.className = 'marker';
 
       // pass the element to the Marker constructor to replace the default
         new mapboxgl.Marker(el)
         .setLngLat(feature.geometry.coordinates)
         .setPopup(
           new mapboxgl.Popup({ offset: 25 })
             .setHTML(
               `<h3>${feature.properties.title}</h3><p>${feature.properties.description}</p>`
             )
         )
         .addTo(map);
    }
    </script>
  </body>
</html>
